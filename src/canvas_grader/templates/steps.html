<p class="steps" aria-label="Progress">
  <span class="{% if step == 1 %}on{% elif step > 1 %}done{% endif %}">1 Upload</span>
  <span class="{% if step == 2 %}on{% elif step > 2 %}done{% endif %}">2 Sample</span>
  <span class="{% if step == 3 %}on{% elif step > 3 %}done{% endif %}">3 Rubric</span>
  <span class="{% if step == 4 %}on{% elif step > 4 %}done{% endif %}">4 Review</span>
  <span class="{% if step == 5 %}on{% endif %}">5 Export</span>
</p>
